# Phase 1 runs Postgres only. The API service is added on the Core CRUD API
# branch, once app/main.py exists to serve.

services:
  db:
    image: postgres:16-alpine
    container_name: podclub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-podclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-podclub}
      POSTGRES_DB: ${POSTGRES_DB:-podclub}
    ports:
      # Published so Alembic and the app can run on the host against Compose.
      - "5432:5432"
    volumes:
      - podclub_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Other services should wait for this rather than racing the socket.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-podclub} -d ${POSTGRES_DB:-podclub}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  podclub_pgdata:
